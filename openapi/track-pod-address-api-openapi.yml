openapi: 3.2.0
info:
  title: Track-POD Address API
  description: Track-POD API enables ERP or any other system integration with Track-POD without need for any manual data input.
  version: '2.0'
security:
- ApiKey: []
tags:
- name: Address
paths:
  /Address:
    post:
      tags:
      - Address
      summary: Add or update address
      operationId: AddAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/xml:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '201':
          description: Address was created successfully
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '202':
          description: Address was updated successfully
        '400':
          description: One or more validation errors
        '401':
          description: Unauthorized. Invalid X-API-KEY in the request header
        '415':
          description: Unsupported Media Type. Invalid Content-Type in the request header. Must be application/json or application/xml
        '429':
          description: Too Many Requests. Rate limit is 20 requests/sec and 400 requests/min
        '500':
          description: Internal Server Error
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        Status:
          type:
          - integer
          - 'null'
          description: The HTTP status code for the response
          format: int32
        Title:
          type:
          - string
          - 'null'
          description: A short, human-readable summary of the response
        Detail:
          type:
          - string
          - 'null'
          description: A human-readable explanation specific to this response.
      additionalProperties: false
      description: 'Object for all API responses, except GET (status code: 200)'
      xml:
        name: ApiResponse
    Address:
      required:
      - FullAddress
      type: object
      properties:
        Id:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Unique identifier in user accounting system
          example: 30495
        Name:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Address name
          example: 2 St Josephs Crescent, Liverpool, L3 3JF
        Street:
          maxLength: 95
          minLength: 0
          type:
          - string
          - 'null'
          description: Street
          example: Josephs Crescent
        City:
          maxLength: 45
          minLength: 0
          type:
          - string
          - 'null'
          description: City
          example: Liverpool
        State:
          maxLength: 95
          minLength: 0
          type:
          - string
          - 'null'
          description: State
          example: ''
        PostalCode:
          maxLength: 15
          minLength: 0
          type:
          - string
          - 'null'
          description: Postal Code
          example: ''
        FullAddress:
          maxLength: 255
          minLength: 0
          type: string
          description: Full (customer's) address
          example: 2 St Josephs Crescent, Liverpool, L3 3JF
        Zone:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Address zone
          example: Lvp
        Lat:
          type:
          - number
          - 'null'
          description: Location latitude
          format: double
          example: 25.290479
        Lon:
          type:
          - number
          - 'null'
          description: Location longitude
          format: double
          example: 65.294049
        TimeSlotFrom:
          type:
          - string
          - 'null'
          description: Desired delivery/pickup time from, yyyy-MM-ddTHH:mm:ss or HH:mm:ss
          format: date-time
          example: '2019-02-01T09:00:00'
        TimeSlotTo:
          type:
          - string
          - 'null'
          description: Desired delivery/pickup time till, yyyy-MM-ddTHH:mm:ss or HH:mm:ss
          format: date-time
          example: '2019-02-01T18:00:00'
      additionalProperties: false
      xml:
        name: Address
  securitySchemes:
    ApiKey:
      type: apiKey
      description: Please enter API key into field
      name: X-API-KEY
      in: header
