components:
  schemas:
    NewPickupOrder:
      type: object
      properties:
        ClientId:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Unique identifier in user accounting system
          example: 247
        Client:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Client/Customer name
          example: Maxima
        AddressId:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Unique identifier in user accounting system
          example: 13587
        Address:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Pickup address
          example: 2 St Josephs Crescent, Liverpool L3 3JF
        AddressLat:
          type:
          - number
          - 'null'
          description: Address GPS Latitude
          format: double
          example: 25.290479
        AddressLon:
          type:
          - number
          - 'null'
          description: Address GPS Longitude
          format: double
          example: 65.294049
        AddressZone:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Address zone
          example: Zone 1
        ContactName:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Customer’s contact name
          example: John Doe
        Phone:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Customer’s contact phone number
          example: '+37061191244'
        Email:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Customer’s e-mail
          example: X-604@maxima.com
        TimeSlotFrom:
          type:
          - string
          - 'null'
          description: Desired pickup time from, yyyy-MM-ddTHH:mm:ss or HH:mm:ss
          format: date-time
          example: '2019-02-01T09:00:00'
        TimeSlotTo:
          type:
          - string
          - 'null'
          description: Desired pickup time till, yyyy-MM-ddTHH:mm:ss or HH:mm:ss
          format: date-time
          example: '2019-02-01T18:00:00'
        ServiceTime:
          type:
          - number
          - 'null'
          description: 'Service Time, min.

            If seconds are specified value will be decimal'
          format: double
          example: 10
        CustomFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NewCustomField'
          description: Custom Fields
          xml:
            name: CustomFields
            wrapped: true
        COD:
          type:
          - number
          - 'null'
          description: Amount of Cash
          format: double
          example: 20.45
        Note:
          maxLength: 500
          minLength: 0
          type:
          - string
          - 'null'
          description: Notes to order
          example: Only to sign Invoice
      additionalProperties: false
      xml:
        name: NewPickupOrder
    RouteTrack:
      type: object
      properties:
        TrackPoints:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RouteTrackPoint'
          description: List of track points
          xml:
            name: TrackPoints
            wrapped: true
      additionalProperties: false
      xml:
        name: RouteTrack
    NewCustomField:
      type: object
      properties:
        Id:
          pattern: cf_\d+
          type:
          - string
          - 'null'
          description: Custom Field Id
          example: cf_456
        Value:
          type:
          - string
          - 'null'
          description: 'Custom Field Value in format:

            CheckBox - true

            Number - 123.45

            Date - 2019-09-18

            Time - 13:00

            DateTime - 2019-09-18T13:45:00

            Text - Text Value'
      additionalProperties: false
      xml:
        name: NewCustomField
    LoadStatus:
      enum:
      - NotLoaded
      - Loaded
      - Scanned
      type: string
    NewRoute:
      type: object
      properties:
        Code:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Route code/number
          example: R0001234
        Id:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Unique identifier in user accounting system
          example: 1234
        Date:
          type:
          - string
          - 'null'
          description: Route date, yyyy-MM-dd
          format: date-time
          example: '2019-02-01'
        StartTimePlan:
          type:
          - string
          - 'null'
          description: Planned Start Time, yyyy-MM-ddTHH:mm:ss or HH:mm
          format: date-time
          example: '13:00'
        DepotId:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Unique identifier in user accounting system
          example: 1
        Depot:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Depot address
          example: 9 Riverside, Salford M7 1PA
        StartFromDepot:
          type:
          - boolean
          - 'null'
          description: Start route from depot
          example: true
        ReturnToDepot:
          type:
          - boolean
          - 'null'
          description: Return to depot
          example: true
        DriverLogin:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Driver's login
          example: 'RT567 '
        DriverPassword:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Driver’s password
          example: 1
        DriverName:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Driver’s First Name and Last Name
          example: Peter G.
        DriverVehicle:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Driver’s vehicle license plate number
          example: FCU 819
        Vehicle:
          $ref: '#/components/schemas/Vehicle'
        Orders:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NewOrder'
          xml:
            name: Orders
            wrapped: true
        CustomFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NewCustomField'
          description: Custom Fields
          xml:
            name: CustomFields
            wrapped: true
        RouteDate:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
      xml:
        name: NewRoute
    Goods:
      type: object
      properties:
        OrderLineId:
          type:
          - string
          - 'null'
          description: Order line (goods line in the order) unique identifier in user accounting system
          example: 22435324
        GoodsId:
          type:
          - string
          - 'null'
          description: Goods (directory) unique identifier in user accounting system
          example: 30495
        GoodsName:
          type:
          - string
          - 'null'
          description: Item Description - Goods, load, packaging
          example: Some big mystic box
        GoodsUnit:
          type:
          - string
          - 'null'
          description: 'Unit of measure: pcs, pkg, kg, lbs'
          example: pcs.
        Note:
          type:
          - string
          - 'null'
          description: Notes for delivery/pickup
          example: ID3658AAA
        Quantity:
          type:
          - number
          - 'null'
          description: Quantity or weight
          format: double
          example: 10.5
        QuantityFact:
          type:
          - number
          - 'null'
          description: Quantity or weight at fact(accepted quantity/actual quantity)
          format: double
          example: 9.5
        Cost:
          type:
          - number
          - 'null'
          description: Unit price
          format: double
          example: 2.99
        RejectReason:
          type:
          - string
          - 'null'
          description: Reject reason for goods
          example: Out Of Time
        HasPhoto:
          type:
          - boolean
          - 'null'
          description: Photo attached
          example: true
        Photos:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Array of links for download jpg file (each link is available for 24h from API call)
          xml:
            name: Photos
          example:
          - https://image.track-pod.com/...
        OrderLineBarcode:
          type:
          - string
          - 'null'
          description: Order line (goods line in the order) barcode
          example: 1234567890123
        GoodsBarcode:
          type:
          - string
          - 'null'
          description: Goods (directory) barcode
          example: 1234567890123
        Scanned:
          type:
          - boolean
          - 'null'
          description: Goods is scanned in the mobile application
          example: false
        LoadStatus:
          type:
          - string
          - 'null'
          description: 'Status code: none; loaded; not-loaded;'
          example: loaded
        LoadCheckScanRejectReason:
          type:
          - string
          - 'null'
          description: Reject reason for goods' scanning when order is loaded
          example: Barcode is Damaged
        ScanRejectReason:
          type:
          - string
          - 'null'
          description: Reject reason for goods' scanning
          example: Barcode is Damaged
      additionalProperties: false
      xml:
        name: Goods
    Route:
      type: object
      properties:
        Code:
          type:
          - string
          - 'null'
          description: Route code/number
          example: R0001234
        Id:
          type:
          - string
          - 'null'
          description: Unique identifier in user accounting system
          example: 1234
        Date:
          type: string
          description: Route date, yyyy-MM-dd
          format: date-time
          example: '2019-02-01'
        DepotId:
          type:
          - string
          - 'null'
          description: Unique identifier in user accounting system
          example: 1
        Depot:
          type:
          - string
          - 'null'
          description: Depot address
          example: '9 Riverside, Salford M7 1PA '
        StartFromDepot:
          type:
          - boolean
          - 'null'
          description: Start route from depot
          example: true
        ReturnToDepot:
          type:
          - boolean
          - 'null'
          description: Return to depot
          example: true
        DriverLogin:
          type:
          - string
          - 'null'
          description: Driver's login
          example: 'RT567 '
        DriverName:
          type:
          - string
          - 'null'
          description: Driver’s First Name and Last Name
          example: Peter G.
        DriverNumber:
          type: integer
          description: Driver Number
          format: int32
          example: 2
        DriverVehicle:
          type:
          - string
          - 'null'
          description: Vehicle license plate number
          example: FCU 819
        StartDate:
          type:
