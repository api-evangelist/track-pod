openapi: 3.2.0
info:
  title: Track-POD Route API
  description: Track-POD API enables ERP or any other system integration with Track-POD without need for any manual data input.
  version: '2.0'
security:
- ApiKey: []
tags:
- name: Route
paths:
  /Route:
    post:
      tags:
      - Route
      summary: Add route
      operationId: AddRoute
      parameters:
      - name: update
        in: query
        description: Add or remove orders from the route if route already exists on this date.
        schema:
          type: boolean
          default: false
      - name: updateAddressGps
        in: query
        description: Force update existing Lat/Lon in the Addresses directory from the payload data.
        schema:
          type: boolean
          default: false
      - name: mergeAddresses
        in: query
        description: Merge orders by address onto one site
        schema:
          type: boolean
          default: true
      - name: updateGoodsPrice
        in: query
        description: Force update existing Price in the Goods directory from the payload data.
        schema:
          type: boolean
          default: false
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRoute'
          application/xml:
            schema:
              $ref: '#/components/schemas/NewRoute'
      responses:
        '201':
          description: Route was created successfully
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '202':
          description: Route was updated successfully
        '400':
          description: One or more validation errors
        '401':
          description: Unauthorized. Invalid X-API-KEY in the request header
        '405':
          description: Not Allowed. Subscription plan limitation.
        '415':
          description: Unsupported Media Type. Invalid Content-Type in the request header. Must be application/json or application/xml
        '429':
          description: Too Many Requests. Rate limit is 20 requests/sec and 400 requests/min
        '500':
          description: Internal Server Error
  /Route/Code/{code}:
    put:
      tags:
      - Route
      summary: Update route by code
      operationId: UpdateRouteByCode
      parameters:
      - name: code
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: updateAddressGps
        in: query
        description: Force update existing Lat/Lon in the Addresses directory from the payload data.
        schema:
          type: boolean
          default: false
      - name: mergeAddresses
        in: query
        description: Merge orders by address onto one site
        schema:
          type: boolean
          default: true
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/NewRoute'
          application/json:
            schema:
              $ref: '#/components/schemas/NewRoute'
          text/json:
            schema:
              $ref: '#/components/schemas/NewRoute'
          application/*+json:
            schema:
              $ref: '#/components/schemas/NewRoute'
          application/xml:
            schema:
              $ref: '#/components/schemas/NewRoute'
          text/xml:
            schema:
              $ref: '#/components/schemas/NewRoute'
          application/*+xml:
            schema:
              $ref: '#/components/schemas/NewRoute'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '202':
          description: Route was updated successfully
        '400':
          description: One or more validation errors
        '401':
          description: Unauthorized. Invalid X-API-KEY in the request header
        '404':
          description: Not Found. Route not found
        '405':
          description: Not Allowed. Subscription plan limitation.
        '429':
          description: Too Many Requests. Rate limit is 20 requests/sec and 400 requests/min
    get:
      tags:
      - Route
      summary: Get route by code
      operationId: GetRouteByCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A route
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Route'
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
            text/json:
              schema:
                $ref: '#/components/schemas/Route'
            application/xml:
              schema:
                $ref: '#/components/schemas/Route'
            text/xml:
              schema:
                $ref: '#/components/schemas/Route'
        '401':
          description: Unauthorized. Invalid X-API-KEY in the request header
        '404':
          description: Not found. Route not found
        '429':
          description: Too Many Requests. Rate limit is 20 requests/sec and 400 requests/min
        '500':
          description: Internal Server Error
    delete:
      tags:
      - Route
      summary: Delete route by code
      operationId: DeleteRouteByCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: deleteOrders
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Route has been deleted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request. Route already has delivery status
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized. Invalid X-API-KEY in the request header
        '404':
          description: Not found. Route not found
        '429':
